<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirage of Light</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
    /* On a phone, fingers walk and look: no scrolling, zooming or text selection */
    body.touch { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; }

    #audio-controls {
      position: absolute;
      bottom: 28px;
      right: 28px;
      color: rgba(255, 250, 240, 0.85);
      background: rgba(10, 10, 18, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      font-style: italic;
      display: flex;
      align-items: center;
    }
    #volume-slider {
      margin-left: 10px;
      width: 100px;
      accent-color: #ffcc66;
    }
    #audio-controls { transition: opacity 0.6s ease, visibility 0.6s; }
    /* It can't be used while the pointer is locked, so it steps aside until Esc */
    body.locked #audio-controls { opacity: 0; visibility: hidden; }

    /* A faint point at the centre of the view, only while looking around */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 250, 240, 0.5);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.45), 0 0 6px rgba(255, 204, 102, 0.2);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    body.locked #crosshair { opacity: 1; }
    /* Something in focus: the point opens into a faint ring */
    #crosshair::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11px;
      height: 11px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 226, 176, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #crosshair.focused::after { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* What can be done with the thing in focus: one quiet line under the crosshair */
    #interaction-prompt {
      position: absolute;
      top: calc(50% + 20px);
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translate(-50%, 3px);
      color: rgba(255, 250, 240, 0.8);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      font-style: italic;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease, transform 0.12s ease; /* Gone almost at once */
    }
    #interaction-prompt.visible {
      opacity: 1;
      transform: translate(-50%, 0);
      transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #interaction-prompt.busy { opacity: 0.4; } /* A longer interaction is playing out */
    #interaction-prompt .key {
      min-width: 15px;
      box-sizing: border-box;
      padding: 0 3px;
      border: 1px solid rgba(255, 226, 176, 0.5);
      border-radius: 4px;
      color: rgba(255, 226, 176, 0.9);
      font-size: 11px;
      font-style: normal;
      line-height: 15px;
      text-align: center;
    }
    #interaction-prompt .key[hidden] { display: none; }

    #instructions {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 18px;
      pointer-events: none;
    }
    #instructions.hidden { display: none; }

    /* Story lines: a quiet subtitle in the bottom-left corner that drifts in and fades away */
    #story {
      position: absolute;
      left: 28px;
      bottom: 28px;
      max-width: min(440px, calc(100vw - 56px));
      padding: 14px 20px 15px 18px;
      border-left: 2px solid rgba(255, 204, 102, 0.7);
      border-radius: 2px 10px 10px 2px;
      background: linear-gradient(90deg, rgba(10, 10, 18, 0.62), rgba(10, 10, 18, 0.32));
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: rgba(255, 250, 240, 0.95);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-style: italic;
      line-height: 1.55;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* Don't block controls */

      opacity: 0;
      transform: translateY(14px);
      filter: blur(2px);
      transition: opacity 0.9s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
    }
    #story.visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    /* The traveller's letters: ink on a scrap of paper */
    #story.letter {
      border-left: none;
      border-radius: 3px;
      background: rgba(238, 228, 206, 0.93);
      color: #3b2f22;
      text-shadow: none;
      font-size: 19px;
      line-height: 1.6;
      padding: 18px 24px 19px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    /* On narrow screens, sit above the volume control */
    @media (max-width: 640px) {
      #story { left: 16px; right: 16px; bottom: 84px; max-width: none; font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #story { transform: none; filter: none; transition: opacity 0.4s ease; }
      #interaction-prompt, #interaction-prompt.visible { transform: translate(-50%, 0); }
    }

    /* A constellation's name, beside its figure while the gaze rests on it */
    #constellation {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
      color: rgba(255, 226, 176, 0.95);
      font-family: Georgia, 'Times New Roman', serif;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
    }
    #constellation .name { display: block; font-size: 17px; letter-spacing: 0.18em; text-transform: uppercase; }
    #constellation .meaning { display: block; margin-top: 3px; font-size: 14px; font-style: italic; opacity: 0.75; }
    #constellation .meaning:empty { display: none; }

    /* A quiet prompt, e.g. "E — sit" under the old tree */
    #hint {
      position: absolute;
      left: 50%;
      bottom: 150px; /* Above the letters in the corner */
      transform: translate(-50%, 8px);
      color: rgba(255, 250, 240, 0.85);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      font-style: italic;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    #hint.visible { opacity: 1; transform: translate(-50%, 0); }
    /* On a phone the quiet prompts are what you tap */
    body.touch #hint.visible, body.touch #interaction-prompt.visible {
      pointer-events: auto;
      padding: 10px 18px;
      border-radius: 18px;
      background: rgba(10, 10, 18, 0.35);
    }

    /* Where the walking thumb is: a faint ring */
    .touch-ring {
      position: absolute;
      width: 84px;
      height: 84px;
      border: 1px solid rgba(255, 226, 176, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .touch-ring.visible { opacity: 1; }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background-color: #f4ecdd; /* Warm, like morning light */
      opacity: 0;
      transition: opacity 8s;
      pointer-events: none;
    }
    #fade-overlay.visible { opacity: 1; }

    #restart-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      background-color: #ffcc66;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }
    #restart-button.visible { display: block; }
  </style>
</head>
<body>
<div id="audio-controls">
  <label for="volume-slider">Volume:</label>
  <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7">
</div>
<div id="instructions">Click to start<br>WASD / Arrow Keys to walk · Shift to hurry · Space to jump</div>
<div id="crosshair" aria-hidden="true"></div>
<div id="interaction-prompt"><span class="key">E</span><span class="label"></span></div>
<div id="story"></div>
<div id="constellation" aria-live="polite"><span class="name"></span><span class="meaning"></span></div>
<div id="hint">E — sit</div>
<div id="fade-overlay"></div>
<button id="restart-button">Walk again</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
