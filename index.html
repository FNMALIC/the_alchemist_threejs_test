<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mirage of Light</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
    canvas { display: block; }

    #audio-controls {
      position: absolute;
      bottom: 28px;
      right: 28px;
      color: rgba(255, 250, 240, 0.85);
      background: rgba(10, 10, 18, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      font-style: italic;
      display: flex;
      align-items: center;
    }
    #volume-slider {
      margin-left: 10px;
      width: 100px;
      accent-color: #ffcc66;
    }

    #instructions {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 18px;
      pointer-events: none;
    }
    #instructions.hidden { display: none; }

    /* Story lines: a quiet subtitle in the bottom-left corner that drifts in and fades away */
    #story {
      position: absolute;
      left: 28px;
      bottom: 28px;
      max-width: min(440px, calc(100vw - 56px));
      padding: 14px 20px 15px 18px;
      border-left: 2px solid rgba(255, 204, 102, 0.7);
      border-radius: 2px 10px 10px 2px;
      background: linear-gradient(90deg, rgba(10, 10, 18, 0.62), rgba(10, 10, 18, 0.32));
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: rgba(255, 250, 240, 0.95);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      font-style: italic;
      line-height: 1.55;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* Don't block controls */

      opacity: 0;
      transform: translateY(14px);
      filter: blur(2px);
      transition: opacity 0.9s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
    }
    #story.visible {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    /* On narrow screens, sit above the volume control */
    @media (max-width: 640px) {
      #story { left: 16px; right: 16px; bottom: 84px; max-width: none; font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #story { transform: none; filter: none; transition: opacity 0.4s ease; }
    }

    /* A quiet prompt, e.g. "E — sit" under the old tree */
    #hint {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translate(-50%, 8px);
      color: rgba(255, 250, 240, 0.85);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      font-style: italic;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    #hint.visible { opacity: 1; transform: translate(-50%, 0); }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background-color: #f4ecdd; /* Warm, like morning light */
      opacity: 0;
      transition: opacity 8s;
      pointer-events: none;
    }
    #fade-overlay.visible { opacity: 1; }

    #restart-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 20px;
      background-color: #ffcc66;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: none;
    }
    #restart-button.visible { display: block; }
  </style>
</head>
<body>
<div id="audio-controls">
  <label for="volume-slider">Volume:</label>
  <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.7">
</div>
<div id="instructions">Click to start<br>WASD / Arrow Keys to walk · Shift to hurry · Space to jump</div>
<div id="story"></div>
<div id="hint">E — sit</div>
<div id="fade-overlay"></div>
<button id="restart-button">Walk again</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
